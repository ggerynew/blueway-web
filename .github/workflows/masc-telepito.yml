name: MASC feltöltő — Windows telepítő

# Kézzel indítható. Legyártja a telepíthető Windows-programot (.exe), és
# feltölti a futás mellé, ahonnan letölthető.
#
# MIÉRT ITT FUT, ÉS NEM A FEJLESZTŐI GÉPEN
#
# A telepítő gyártásához Windows kell — az electron-builder a Windows-os
# futtatókörnyezetet és aláírási eszközöket ott találja meg. A fejlesztői
# homokozó Linux, és az Electron binárisát sem tudja letölteni. A GitHub
# Windows-futtatója mindkettőt megoldja.
#
# HOL LESZ AZ EREDMÉNY
#
# A futás oldalán, az „Artifacts" szakaszban egy zip-ben. Kibontva a
# telepítő .exe fut, és a szokásos módon telepíti a programot: Start menü,
# asztali ikon, Programok és szolgáltatások alatt eltávolítható.
#
# ALÁÍRÁS
#
# A telepítő nincs kódaláírással ellátva, ezért a Windows SmartScreen első
# indításkor figyelmeztet („Ismeretlen közzétevő"). Ilyenkor a „További
# információ" → „Futtatás mindenképpen" úton indítható. Aláíró tanúsítvány
# beszerzése után ez a lépés kiváltható.
on:
  workflow_dispatch:
    inputs:
      valtozat:
        description: 'Verziószám (üresen a package.json szerinti)'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: masc-feltolto

jobs:
  telepito:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: masc-feltolto/package-lock.json

      - run: npm ci

      # Nem gyártunk telepítőt olyan kódból, ami el sem indulna: a
      # típusellenőrzés és a próbák itt is lefutnak, Windowson.
      - name: Típusellenőrzés
        run: npm run ellenoriz

      - name: Próbák
        run: npm run teszt

      - name: Verziószám beállítása
        if: inputs.valtozat != ''
        run: npm version "${{ inputs.valtozat }}" --no-git-tag-version

      - name: Telepítő gyártása
        run: npm run epit:windows

      - name: Mi készült el?
        run: |
          Get-ChildItem kiadas -Filter *.exe | ForEach-Object {
            "{0} — {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }
        shell: pwsh

      - name: A telepítő megőrzése
        uses: actions/upload-artifact@v4
        with:
          name: masc-bizonylat-feltolto-windows
          path: masc-feltolto/kiadas/*.exe
          if-no-files-found: error
          retention-days: 30
