name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /blueway-web
          # Server-side form sending. Defaults to the live Formspree form; a
          # FORMSPREE_ENDPOINT repo secret overrides it (set it to an empty
          # string to go back to the mailto-only behaviour). The endpoint is
          # public either way — it ships in the client bundle.
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT || 'https://formspree.io/f/mgogrvpe' }}
          # Cookieless visitor analytics. Defaults to the live blueway account;
          # a GOATCOUNTER_CODE repo secret overrides it (set it to an empty
          # string to switch the measurement off).
          NEXT_PUBLIC_GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE || 'blueway' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
