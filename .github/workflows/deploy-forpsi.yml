name: Deploy to FORPSI

# Élesítés a saját tárhelyre: minden main-re érkező változtatás pár percen
# belül kikerül a blueway.hu-ra. A GitHub Pages-es deploy megmarad
# előnézetnek, ez a munkafolyamat attól független.
#
# Addig nem csinál semmit, amíg nincsenek beállítva a hozzáférési adatok
# (repo secrets) — így a bekapcsolás egyetlen lépés, kódmódosítás nélkül.
#
# Beállítandó secretek — Settings → Secrets and variables → Actions:
#
#   SSH-val (ajánlott, gyorsabb és megbízhatóbb):
#     FORPSI_SSH_HOST     opcionális; üresen a saját domain (SITE_URL) a gazdanév
#     FORPSI_SSH_USER     az SSH felhasználónév
#     FORPSI_SSH_KEY      a privát kulcs teljes tartalma
#     FORPSI_WEB_ROOT     a webgyökér útvonala a szerveren, pl. /web
#     FORPSI_SSH_PORT     opcionális; üresen 2222, a FORPSI dokumentált portja
#
#   Ha az SSH be van állítva, de nem működik, a deploy nem áll meg: az FTP-s
#   lépés veszi át, és a napló végén figyelmeztetés jelzi, hogy mi történt.
#
#   vagy FTP-vel (ha az SSH nincs bekapcsolva):
#     FORPSI_FTP_HOST     ftpx.forpsi.com
#     FORPSI_FTP_USER     az FTP felhasználónév
#     FORPSI_FTP_PASSWORD az FTP jelszó
#     FORPSI_WEB_ROOT     a webgyökér útvonala, pl. / vagy /web
#
#   közös, opcionális:
#     SITE_URL            alapértelmezés: https://blueway.hu

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      delete_extra:
        description: 'A szerveren lévő, a buildben nem szereplő fájlok törlése'
        type: boolean
        default: false
      archivalas:
        description: 'A régi weblap maradékának áthelyezése az ARCHIVE mappába'
        type: choice
        default: kihagy
        options: [kihagy, probafutas, vegrehajt]
      levelproba:
        description: 'Valódi próbalevelek küldése 7 és 8 MB csatolmánnyal az info@ címre'
        type: choice
        default: kihagy
        options: [kihagy, vegrehajt]

concurrency:
  group: forpsi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL || 'https://blueway.hu' }}
      HAS_SSH: ${{ secrets.FORPSI_SSH_KEY != '' }}
      HAS_FTP: ${{ secrets.FORPSI_FTP_PASSWORD != '' }}
      # Csak akkor van dolgunk vele, ha a .us SAJÁT webgyökeret kapott a
      # tárhelyen. Ha ugyanabból a mappából szolgálják ki, a .htaccess intézi,
      # és ez a secret üresen maradhat.
      HAS_US_ROOT: ${{ secrets.FORPSI_US_WEB_ROOT != '' }}
    steps:
      - name: Van-e mihez kapcsolódni?
        id: gate
        run: |
          if [ "$HAS_SSH" = "true" ] || [ "$HAS_FTP" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nincsenek beállítva a FORPSI hozzáférési adatok — a deploy kimarad."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.go == 'true'

      - name: Build az éles domainre
        if: steps.gate.outputs.go == 'true'
        run: npm run build
        env:
          STATIC_EXPORT: '1'
          # Üres base path: a weblap a domain gyökerében lakik, nem alkönyvtárban.
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          # A saját tárhelyen a send.php küld, nem a Formspree.
          #
          # A végpont RELATÍV, szándékosan. Teljes címmel (https://blueway.hu/…)
          # az űrlap küldése elbukik: a tárhely a www nélküli alakot 301-gyel a
          # www.-re irányítja, a böngésző pedig 301-nél a POST-ot GET-re váltja
          # és eldobja az adatokat. A send.php ilyenkor 405-öt ad, a weblap
          # pedig a mailto-tartalékra vált — pontosan ez volt a tünet. Relatív
          # címmel a kérés ugyanarra a gépre megy, ahonnan az oldal jött, tehát
          # se átirányítás, se eltérő eredetből fakadó korlátozás nincs.
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ secrets.FORM_ENDPOINT || '/send.php' }}
          NEXT_PUBLIC_GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE || 'blueway' }}

      - name: Ellenőrzés — a kimenet átvizsgálása (weblap-audit)
        if: steps.gate.outputs.go == 'true'
        # Az auditor kapuőrnek készült (hibánál 1-gyel lép ki), de eddig
        # egyetlen munkafolyamat sem futtatta: egy hiányzó célra mutató
        # hivatkozás vagy egy elveszett canonical akadálytalanul élesedett
        # volna. Mostantól a hibás kimenet fel sem töltődik.
        run: node scripts/weblap-audit.mjs

      - name: A szerveroldali fájlok a feltöltendő mappába
        if: steps.gate.outputs.go == 'true'
        run: |
          cp server/.htaccess server/send.php server/.user.ini out/
          # A bluewaytrade.us átmeneti oldala. A mappa ÖNMAGÁBAN teljes (HTML,
          # logó, ikon), hogy akkor is feltölthető legyen, ha a .us saját
          # webgyökeret kapott a tárhelyen — akkor ugyanez a mappa megy oda.
          # A logó itt nagyobb felbontású, mint a weblap fejlécében: ezen a
          # lapon ez az egyetlen tartalom, és nagy méretben jelenik meg.
          #
          # NEM az /us/ mappába: az mostantól az amerikai angol nyelvi változat
          # helye (out/us/**, 110 lap a sitemapben). Ha ide másolnánk, a
          # `cp -r` a meglévő mappa ALÁ tenné (out/us/us), a lenti ellenőrzés
          # pedig elhasalna — pontosan ez döntötte le a deployt.
          cp -r server/us-atmeneti out/us-atmeneti
          test -s out/us-atmeneti/blueway-logo-anim.webp
          test -s out/us-atmeneti/blueway-logo-still.png
          test ! -e out/us/us

      - name: Ellenőrzés — a build nem üres
        if: steps.gate.outputs.go == 'true'
        run: |
          # Egy elrontott build ne törölje le a működő weblapot.
          count=$(find out -type f | wc -l)
          echo "Feltöltendő fájlok: $count"
          test "$count" -gt 500 || { echo "::error::Gyanúsan kevés fájl ($count) — a deploy leáll."; exit 1; }
          test -f out/index.html || { echo "::error::Hiányzik az out/index.html."; exit 1; }
          test -f out/send.php || { echo "::error::Hiányzik az out/send.php."; exit 1; }

      # ——— SSH / rsync ———————————————————————————————————————————
      - name: Feltöltés SSH-val
        id: ssh
        # Nem állítja meg a deployt: ha az SSH nem megy, az FTP-s lépés
        # veszi át. A weblap frissülése fontosabb, mint az, hogy melyik
        # csatornán jut ki — a hibáról a napló végén külön szó esik.
        continue-on-error: true
        if: steps.gate.outputs.go == 'true' && env.HAS_SSH == 'true'
        env:
          SSH_KEY: ${{ secrets.FORPSI_SSH_KEY }}
          SSH_HOST: ${{ secrets.FORPSI_SSH_HOST }}
          SSH_USER: ${{ secrets.FORPSI_SSH_USER }}
          SSH_PORT: ${{ secrets.FORPSI_SSH_PORT }}
          WEB_ROOT: ${{ secrets.FORPSI_WEB_ROOT }}
          DELETE_EXTRA: ${{ inputs.delete_extra }}
          # Csak a hibakereséshez: ha az SSH-gazdanév nem válaszol, kiderül,
          # hogy az FTP-é válaszol-e helyette. Magát a nevet nem írjuk ki.
          FTP_HOST_OSSZEVETES: ${{ secrets.FORPSI_FTP_HOST }}
        run: |
          # A FORPSI dokumentált kapcsolódási alakja:
          #   ssh -p 2222 felhasznalonev@sajat-domain.com
          # Tehát a gazdanév a SAJÁT DOMAIN, a port pedig 2222 — nem a 22.
          # Ez a munkafolyamat kizárólag FORPSI-ra telepít, úgyhogy ezek az
          # alapértelmezések; a titkok felülírják, ha egyszer más lesz.
          # Mérés is alátámasztja: a blueway.hu:2222 ad gazdakulcsot, a
          # korábbi beállítás egyetlen porton sem.
          SAJAT=$(printf '%s' "$SITE_URL" | sed 's#^https\?://##; s#/.*##')
          HOST="${SSH_HOST:-$SAJAT}"
          PORT="${SSH_PORT:-2222}"

          # A titkok végéről levágjuk a láthatatlan szemetet: sortörés, szóköz,
          # tabulátor. A GitHub titokmezőjébe beillesztéskor könnyen odakerül,
          # a kimásolt sor végén ott marad — az OpenSSH viszont kereken
          # visszautasítja: „remote username contains invalid characters”.
          # Pontosan ez történt; ugyanaz a baj, mint a kulcs CRLF-je.
          TISZTIT() { printf '%s' "$1" | tr -d '\r\n\t' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          SSH_USER_EREDETI="$SSH_USER"
          SSH_USER=$(TISZTIT "$SSH_USER")
          HOST=$(TISZTIT "$HOST")
          if [ "$SSH_USER" != "$SSH_USER_EREDETI" ]; then
            echo "::warning::A FORPSI_SSH_USER titok végén szóköz vagy sortörés volt — levágtam. Érdemes a titkot is megtisztítani."
          fi

          if [ -z "$SSH_USER" ]; then
            echo "::error::A FORPSI_SSH_USER titok üres — felhasználónév nélkül nincs mihez csatlakozni."
            exit 1
          fi
          # Amit az OpenSSH nem fogad el felhasználónévben. Ha ilyen maradt
          # benne, a hiba nem beillesztési malőr, hanem rossz érték — például
          # a teljes e-mail cím vagy a „felhasznalo@gep” alak a puszta név
          # helyett.
          case "$SSH_USER" in
            *@* | *[\ \'\"\;\&\<\>\|\(\)\$\`\\!\*\?]* | -*)
              echo "::error::A FORPSI_SSH_USER értéke nem érvényes felhasználónév. Csak a kukac ELŐTTI részt kell megadni (a FORPSI alakja: ssh -p 2222 felhasznalonev@sajat-domain.com), idézőjel és szóköz nélkül."
              exit 1 ;;
          esac
          # Mérföldkövek külön fájlba is: a lépés naplója a build és az
          # ellenőrzés közé szorul, a záró összefoglaló pedig ebből mondja
          # meg, MEDDIG jutott el a kapcsolatfelvétel. Enélkül csak annyi
          # látszik, hogy „nem ment", és a következő kör megint tippelés.
          JEGYZET() { printf '%s\n' "$*" | tee -a /tmp/ssh-allapot.txt; }
          JEGYZET "— SSH-kapcsolat előkészítése ($HOST, port $PORT) —"
          mkdir -p ~/.ssh
          # A soremelés-karakter (\r) eltávolítása. Windowson generált és
          # onnan bemásolt kulcsnál a sorok CR+LF-fel érnek véget; az OpenSSH
          # ilyenkor „error in libcrypto"-val elszáll, mert a base64-törzsbe
          # nem való a \r. Ez a legapróbb és leggyakoribb buktató, viszont
          # ártalmatlanul javítható — a kulcs tartalmát nem érinti.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Mit kaptunk egyáltalán? A tartalomból semmit nem írunk ki — csak
          # olyan tulajdonságokat, amikből a kulcs nem állítható vissza, de a
          # tipikus beillesztési hibák azonnal látszanak.
          SOROK=$(wc -l < ~/.ssh/id_deploy)
          JEGYZET "  a kulcs $SOROK sor"
          head -1 ~/.ssh/id_deploy | grep -q -- '-----BEGIN .*PRIVATE KEY-----' \
            || echo "::error::Az első sor nem a -----BEGIN … PRIVATE KEY----- sor. Talán a PUBLIKUS kulcs (.pub) került a titokba a privát helyett."
          tail -1 ~/.ssh/id_deploy | grep -q -- '-----END .*PRIVATE KEY-----' \
            || echo "::error::Az utolsó sor nem a -----END … PRIVATE KEY----- sor — a tartalom csonka."
          [ "$SOROK" -ge 4 ] \
            || echo "::error::A kulcs túl kevés sorból áll: a beillesztésnél elvesztek a sortörések."

          # A kulcs formájának ellenőrzése, MIELŐTT bármit próbálnánk vele.
          # A -y a publikus felét számolja ki a privátból: ha ez lefut, a
          # kulcs ép, és az ujjlenyomatból az is látszik, ugyanaz-e, mint ami
          # a kiszolgálóra került.
          if ! ssh-keygen -y -f ~/.ssh/id_deploy -P '' > /tmp/kulcs.pub 2>/tmp/kulcs-hiba.txt; then
            echo "::error::A privát kulcs nem olvasható: $(cat /tmp/kulcs-hiba.txt)"
            echo "  A FORPSI_SSH_KEY titokban a -----BEGIN OPENSSH PRIVATE KEY----- sortól a"
            echo "  -----END OPENSSH PRIVATE KEY----- sorig MINDENNEK benne kell lennie, sortörésekkel."
            echo "  Windowson a legbiztosabb másolás a vágólapra irányítás — így nem lehet lemaradni"
            echo "  a nyitó vagy a záró sorról:   type %USERPROFILE%\\.ssh\\blueway-deploy | clip"
            echo "  Utána a GitHub titok mezőjébe Ctrl+V."
            rm -f ~/.ssh/id_deploy; exit 1
          fi
          JEGYZET "  a kulcs ép, ujjlenyomata: $(ssh-keygen -lf /tmp/kulcs.pub | awk '{print $2}')"

          # Válaszol-e egyáltalán a kiszolgáló ezen a porton? A kimenetet NEM
          # dobjuk el: korábban ez rejtette el a hiba okát.
          if ! ssh-keyscan -p "$PORT" -T 10 "$HOST" > ~/.ssh/known_hosts 2>/tmp/keyscan.txt; then
            JEGYZET "::error::Az ssh-keyscan nem futott le rendben (kilépési kód nem nulla)."
          fi
          sed 's/^/  keyscan: /' /tmp/keyscan.txt || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            JEGYZET "::error::A kiszolgáló nem adott vissza gazdakulcsot a(z) $PORT porton — a keyscan üres."

            # Innentől már elhasaltunk, tehát ráérünk keresgélni: a három
            # eset (rossz port / rossz gépnév / zárt tűzfal) kívülről
            # ugyanúgy néz ki, pedig egészen mást kell tenni ellenük.
            # Gazdanevet nem írunk ki, csak azt, melyik eset jött be.
            for P in 22 2222 22222 2022; do
              if ssh-keyscan -p "$P" -T 5 "$HOST" 2>/dev/null | grep -q '^[^#]'; then
                JEGYZET "  a(z) $P porton VAN SSH — ezt kell a FORPSI_SSH_PORT titokba írni"
              fi
            done
            if [ -n "$FTP_HOST_OSSZEVETES" ] \
               && ssh-keyscan -T 5 "$FTP_HOST_OSSZEVETES" 2>/dev/null | grep -q '^[^#]'; then
              JEGYZET "  az FTP-gazdanév viszont felel SSH-ra a 22 porton — a FORPSI_SSH_HOST titok rossz gépre mutat"
            fi
            # Ha a titokban más gazdanév áll, a saját domaint külön is
            # megnézzük: a FORPSI szerint az a helyes cím, és ha felel,
            # kimondjuk, mit kell a titokba írni. (A SAJAT a lépés elején
            # már megvan.)
            for P in 2222 22; do
              if ssh-keyscan -p "$P" -T 5 "$SAJAT" 2>/dev/null | grep -q '^[^#]'; then
                JEGYZET "  a SAJÁT DOMAIN ($SAJAT) felel SSH-ra a(z) $P porton — a FORPSI_SSH_HOST legyen $SAJAT, a FORPSI_SSH_PORT pedig $P"
              fi
            done

            echo "  Vagy nincs bekapcsolva az SSH, vagy más porton figyel (ekkor a FORPSI_SSH_PORT titkot állítsd be),"
            echo "  vagy a szolgáltató nem enged be a GitHub futtatóinak IP-címéről."
            rm -f ~/.ssh/id_deploy; exit 1
          fi
          JEGYZET "  a gazdakulcs megvan"

          # Beenged-e a kulcs? Külön lépésben, hogy a hitelesítési hiba ne
          # keveredjen össze az rsync fájlhibáival.
          # A pwd és a mappalista nem kíváncsiskodás: az FTP-hez megadott
          # webgyökér az FTP-belépés saját gyökeréhez képest értendő, SSH-n
          # viszont a fájlrendszer tetejéről — ezért futott az rsync
          # „mkdir … Permission denied”-ba. Innen látszik, mi a helyes út.
          if BELEPES=$(ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes \
                   -o BatchMode=yes -o ConnectTimeout=15 \
                   "$SSH_USER@$HOST" 'pwd; echo "—"; ls -1p | head -20' \
                   2>/tmp/ssh-hiba.txt); then
            JEGYZET "  a bejelentkezés sikerült; a belépési könyvtár és tartalma:"
            printf '%s\n' "$BELEPES" | sed 's/^/    /' | tee -a /tmp/ssh-allapot.txt
          else
            JEGYZET "::error::A bejelentkezés nem sikerült."
            sed 's/^/  ssh: /' /tmp/ssh-hiba.txt || true
            echo "  „Permission denied (publickey)” — a publikus kulcs nincs a kiszolgálón, vagy más a felhasználónév."
            echo "  „This service allows sftp connections only” — a tárhely csak SFTP-t ad, rsync-et nem."
            rm -f ~/.ssh/id_deploy; exit 1
          fi

          # Csak a megváltozott fájlok mennek át — a második deploytól ez
          # néhány másodperc az első teljes szinkron után.
          # A cél útvonala a BELÉPÉSI KÖNYVTÁRHOZ képest értendő, nem a
          # fájlrendszer tetejétől. A FORPSI_WEB_ROOT titkot az FTP-hez adtuk
          # meg, az FTP pedig a fiók saját gyökerébe lép be — ugyanoda,
          # ahová az SSH. A vezető perjel ott a fiókon belüli utat jelenti,
          # itt viszont a gépét: emiatt próbálta az rsync létrehozni a
          # mappát a gyökérben, és kapott „Permission denied”-ot.
          #
          # Ezért a belépési könyvtárat elé illesztjük — kivéve, ha az érték
          # már eleve azzal kezdődik (tehát valaki a teljes utat adta meg).
          BELEPESI_KONYVTAR=$(printf '%s' "$BELEPES" | head -1)
          case "$WEB_ROOT" in
            "$BELEPESI_KONYVTAR"*) CEL="$WEB_ROOT" ;;
            /*)                    CEL="$BELEPESI_KONYVTAR$WEB_ROOT" ;;
            *)                     CEL="$BELEPESI_KONYVTAR/$WEB_ROOT" ;;
          esac
          JEGYZET "  a feltöltés célja: $CEL"

          # Az --out-format=%n minden ÁTVITT tétel nevét kiírja, egy sorban,
          # díszítés nélkül. Ez nem naplózási szépészet: ebből tudjuk meg,
          # mely lapok változtak, és ezt jelentjük be az IndexNow-nak — a
          # Bing ugyanis kifogásolta, hogy minden telepítéskor mind a 907
          # címet bejelentjük. A --checksum miatt a lista TARTALOM szerint
          # pontos, nem a fájlidő szerint (a futtató mindig frissen épít,
          # tehát minden fájl ideje új lenne).
          FLAGS="-rlz --checksum --omit-dir-times --no-perms --out-format=%n"
          if [ "$DELETE_EXTRA" = "true" ]; then FLAGS="$FLAGS --delete"; fi
          # A hibacsatorna külön fájlba is megy: az rsync panasza egyetlen sor
          # a kétezer átmásolt fájlnév között, és a napló végét úgyis az
          # ellenőrző lépés tölti ki — a záró összefoglaló ebből dolgozik.
          rsync $FLAGS -e "ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=yes" \
                 out/ "$SSH_USER@$HOST:$CEL/" >/tmp/rsync-kimenet.txt 2>/tmp/rsync-hiba.txt \
            && RSYNC_ALLAPOT=0 || RSYNC_ALLAPOT=$?
          if [ "$RSYNC_ALLAPOT" -ne 0 ]; then
            JEGYZET "::error::Az rsync nem futott le rendben."
            sed 's/^/  rsync: /' /tmp/rsync-hiba.txt || true
            rm -f ~/.ssh/id_deploy; exit 1
          fi
          rm -f ~/.ssh/id_deploy

          # A megváltozott lapok listája az IndexNow-nak. A „deleting …"
          # sorokat kihagyjuk: azok törlésről szólnak, nem új tartalomról.
          grep -v '^deleting ' /tmp/rsync-kimenet.txt | grep '\.html$' \
            > /tmp/valtozott-lapok.txt || true
          JEGYZET "  átvitt tételek: $(wc -l < /tmp/rsync-kimenet.txt), ebből HTML lap: $(wc -l < /tmp/valtozott-lapok.txt)"

      # ——— FTP ———————————————————————————————————————————————————
      # Akkor is fut, ha az SSH be van állítva, de elhasalt — így egy elrontott
      # kulcs vagy egy kikapcsolt SSH nem hagyja frissítetlenül a weblapot.
      - name: Feltöltés FTP-vel
        if: >-
          steps.gate.outputs.go == 'true' && env.HAS_FTP == 'true' &&
          (env.HAS_SSH != 'true' || steps.ssh.outcome == 'failure')
        env:
          FTP_HOST: ${{ secrets.FORPSI_FTP_HOST }}
          FTP_USER: ${{ secrets.FORPSI_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FORPSI_FTP_PASSWORD }}
          WEB_ROOT: ${{ secrets.FORPSI_WEB_ROOT }}
          FTP_PLAIN: ${{ secrets.FORPSI_FTP_PLAIN }}
          DELETE_EXTRA: ${{ inputs.delete_extra }}
          ARCHIVALAS: ${{ inputs.archivalas }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # A jelszó környezeti változóban megy át, nem a parancssorban: így a
          # benne lévő idézőjel, szóköz vagy $ nem töri el a parancsot, és nem
          # is kerül bele a folyamatlistába.
          export LFTP_PASSWORD="$FTP_PASSWORD"

          # A beillesztésnél elromló hozzáférési adatok kiszűrése. A napló
          # nyilvános lehet, ezért a tartalomból semmit nem írunk ki — csak
          # olyan tulajdonságokat, amikből a beírt érték nem állítható vissza.
          echo "— ellenőrzés —"
          printf 'felhasznalonev hossza: %s\n' "${#FTP_USER}"

          # Van-e ékezetes vagy más nem ASCII karakter a jelszóban? Ilyenkor a
          # kliensek kódolása különbözhet, és a kiszolgáló mást lát, mint amit
          # beírtál. A vizsgálat Pythonnal megy: a bash ${#valtozo} C-locale
          # alatt bájtot számol, nem karaktert, tehát arra nem lehet építeni.
          printf 'jelszo hossza:         %s bajt\n' "$(printf %s "$FTP_PASSWORD" | wc -c)"
          if ! python3 -c 'import os,sys; sys.exit(0 if os.environ["FTP_PASSWORD"].isascii() else 1)'; then
            echo "::warning::A jelszóban ékezetes vagy más nem ASCII karakter van. Ez kliensenként más bájtsorozatként megy el, és pont ilyen 530-at okoz. Kérj a FORPSI-tól új, csak angol betűkből és számokból álló jelszót."
          fi

          # Szóköz vagy sortörés az elején/végén — beillesztésnél a leggyakoribb.
          case "$FTP_USER" in
            [[:space:]]*|*[[:space:]]) echo "::warning::A felhasználónév elején vagy végén szóköz vagy sortörés van!";;
          esac
          case "$FTP_PASSWORD" in
            [[:space:]]*|*[[:space:]]) echo "::warning::A jelszó elején vagy végén szóköz vagy sortörés van!";;
          esac
          case "$FTP_HOST" in
            [[:space:]]*|*[[:space:]]) echo "::warning::A kiszolgáló neve elején vagy végén szóköz vagy sortörés van!";;
          esac

          # A webgyökér attól függ, melyik FTP fiókkal lépünk be:
          #   egy weboldal fiókja -> a gyökérben mindjárt a www van
          #   a fő (.multi) fiók  -> a gyökérben weboldalanként egy mappa
          case "$FTP_USER" in
            *.multi)
              case "$WEB_ROOT" in
                /*/www) echo "webgyoker:             a fő fiókhoz illő alak (<weboldal>/www)" ;;
                *) echo "::warning::A fő (.multi) fiókkal belépve a gyökérben weboldalanként egy mappa van, tehát a webgyökér <weboldal>/www alakú — például /blueway.hu/www. A mostani érték nem ilyen." ;;
              esac
              ;;
            *)
              if [ "$WEB_ROOT" = "/www" ]; then
                echo "webgyoker:             /www (helyes)"
              else
                echo "::warning::Egy weboldal FTP fiókjával belépve a www, subdoms és backups-forpsi mappák látszanak, tehát a webgyökér /www. A mostani érték nem ez."
              fi
              ;;
          esac

          # Passzív mód. A kiszolgáló az aktív átvitelt (PORT) elutasítja —
          # asztali kliensből "PORT failed. Try PASV mode!" a válasza. Az lftp
          # alapból passzív, de mivel tudjuk, hogy másképp nem megy, kimondjuk.
          # Az export azért kell, mert az archiváló szkript külön folyamat:
          # sima shell-változót nem örökölne meg.
          export SETTINGS COMMON
          #
          # ftp:sync-mode false — parancs-csővezeték.
          #
          # Ez a deploy legdrágább tétele elleni fő fegyver. Mérve két éles
          # futáson: fájlonként 0,42 és 0,43 másodperc, miközben a bájtsebesség
          # a kettő közt kétszeresen tért el (248 és 126 kB/s). Tehát nem az
          # adatmennyiség a szűk keresztmetszet, hanem a fájlonkénti
          # oda-vissza kommunikáció: TYPE, PASV, STOR, adatkapcsolat, TLS-
          # kézfogás, 226 — nyolc-tíz kör. Az lftp alapból minden parancs után
          # megvárja a választ; kikapcsolva egymás után küldheti őket.
          COMMON="set ftp:passive-mode true; set ftp:sync-mode false;"
          COMMON="$COMMON set net:max-retries 2; set net:timeout 20;"

          # Titkosított kapcsolat az alapértelmezés. Ha a kiszolgáló nem tudja,
          # a FORPSI_FTP_PLAIN secret bármilyen értékre állításával kikapcsolható.
          #
          # Az adatcsatorna titkosítása szándékosan marad bekapcsolva, pedig a
          # feltöltött tartalom nyilvános weblap, tehát titkosságot nem véd.
          # Amit véd, az a SÉRTETLENSÉG: enélkül az útvonalon bárki átírhatná
          # a feltöltött oldalakat, például kódot fűzhetne hozzájuk. Az ezzel
          # járó fájlonkénti TLS-kézfogás ára vállalható.
          if [ -n "$FTP_PLAIN" ]; then
            echo "Figyelem: titkosítás nélküli FTP (FORPSI_FTP_PLAIN be van állítva)."
            SETTINGS="$COMMON set ftp:ssl-allow false;"
          else
            SETTINGS="$COMMON set ssl:verify-certificate yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:reuse-session yes;"
          fi

          # A bejelentkezés próbája ELŐRE került, a bőbeszédű diagnosztika pedig
          # mögé: ha belépünk, a diagnosztikára nincs szükség, és 9 másodpercet
          # spórolunk minden futáson. Ha nem lépünk be, lefut, és megmondja, hol
          # romlik el.
          echo "Bejelentkezés ellenőrzése: $FTP_USER @ $FTP_HOST"
          if ! lftp -u "$FTP_USER" --env-password \
                 -e "$SETTINGS cd '$WEB_ROOT'; pwd; bye" "$FTP_HOST"; then
            echo "— a bejelentkezés nem sikerült, diagnosztika következik —"
            # Erről a címről és ebből az országból érkezik a bejelentkezés. A
            # FORPSI FTP fiókján országlista szűr (Ügyfélközpont → FTP fül →
            # "Engedélyezett országok"), és a futtató sosem Magyarországon van.
            echo "a futtató publikus IP-cime: $(curl -s --max-time 10 https://api.ipify.org || echo ismeretlen)"
            echo "a futtató országa:          $(curl -s --max-time 10 https://ipinfo.io/country || echo ismeretlen)"
            python3 scripts/ftp-diag.py || true
            echo "::error::Az FTP bejelentkezés nem sikerült. A fenti diagnosztika megmondja, hol romlik el: ha ott is 530-at ad a PASS, akkor a kiszolgáló utasítja el ezt a gépet (jellemzően IP-korlátozás az FTP fiókon — a futtató IP-címe fentebb ki van írva), nem az lftp hívása a hibás. Ha viszont a diagnosztika belépett, akkor az lftp beállításain kell igazítani."
            exit 1
          fi

          # ——— A régi weblap maradékának félretétele ———————————————
          # Kézzel indítva, az "archivalas" beállítással kérhető. Áthelyez,
          # nem töröl, és az ARCHIVE a webgyökéren KÍVÜLRE kerül, hogy a régi
          # fájlok ne legyenek letölthetők.
          if [ "$ARCHIVALAS" = "probafutas" ] || [ "$ARCHIVALAS" = "vegrehajt" ]; then
            bash scripts/ftp-archive.sh "$ARCHIVALAS"
          fi

          # ——— Csak a megváltozott fájlok mennek fel ————————————————
          # A build kimenete 158 MB, ebből 77 MB adatlap-PDF és 3 MB kép-videó.
          # Ezek hónapokig nem változnak, korábban mégis minden futásban
          # újra felmentek — ez volt a tíz percből a java.
          #
          # Az lftp `--only-newer` itt nem segítene: a futtató minden
          # alkalommal üres gépen, frissen állítja elő a fájlokat, tehát a
          # helyi módosítási idő MINDIG frissebb a szerveren lévőnél, akkor
          # is, ha a tartalom azonos. A méret szerinti összehasonlítás
          # (`--ignore-time`) viszont csendben kihagyna egy azonos hosszúságú
          # javítást. Ezért TARTALOM szerint döntünk: sha256 lenyomat minden
          # fájlról, összevetve a szerveren tárolt előző listával.
          #
          # A lista a webgyökérben lakik (deploy-manifest.json), mert a
          # kérdés nem az, mi változott az előző buildhez képest, hanem az,
          # hogy mi tér el attól, ami MOST a szerveren van. Kívülről nem
          # olvasható: a .htaccess külön szabállyal tiltja.
          #
          # A --verbose fájlonként naplóz; 1400+ fájlnál ez több ezer sor, és
          # elnyomja a fenti diagnosztikát. A mirror a végén összegzést ír.
          # Egyszerre ennyi fájl megy fel. A korábbi 4 azért volt kevés, mert a
          # költség fájlonként egy csomó hálózati oda-vissza — az pedig várakozás,
          # nem sávszélesség, tehát jól párhuzamosítható. Ha a tárhely ennyi
          # egyidejű kapcsolatot nem enged, a lenti tartalék ág visszavált.
          PARHUZAM=8

          # A tükrözés futtatása méréssel. A második paraméter a hibára lépő
          # tartalék: kevesebb kapcsolat, csővezeték nélkül — ha a kiszolgáló
          # nem bírja a gyors beállításokat, a deploy attól még végigmegy.
          tukroz() {
            local forras="$1" extra="$2" kezd veg
            kezd=$(date +%s)
            if lftp -u "$FTP_USER" --env-password \
                 -e "$SETTINGS mirror -R --parallel=$PARHUZAM $extra '$forras' '$WEB_ROOT/'; bye" \
                 "$FTP_HOST"; then
              veg=$(date +%s)
              echo "feltöltés: $((veg - kezd)) másodperc ($PARHUZAM párhuzamos kapcsolattal)"
              return 0
            fi
            echo "::warning::A gyors feltöltés elakadt — újra, óvatos beállításokkal (2 kapcsolat, csővezeték nélkül)."
            kezd=$(date +%s)
            lftp -u "$FTP_USER" --env-password \
              -e "$SETTINGS set ftp:sync-mode true; mirror -R --parallel=2 $extra '$forras' '$WEB_ROOT/'; bye" \
              "$FTP_HOST"
            veg=$(date +%s)
            echo "feltöltés (tartalék ág): $((veg - kezd)) másodperc"
          }

          if [ "$DELETE_EXTRA" = "true" ]; then
            # Takarításkor a teljes fát tükrözzük, mert a --delete csak akkor
            # dönthet helyesen, ha a forrás a teljes weblap — egy részhalmazzal
            # letörölné a többit.
            echo "— teljes tükrözés (a nem szereplő fájlok törlésével) —"
            tukroz out/ --delete
            python3 scripts/deploy-valtozas.py --mappa out \
              --stage /tmp/feltoltendo --uj /tmp/deploy-manifest.json > /dev/null
          else
            echo "— mi változott a szerverhez képest? —"
            rm -f /tmp/elozo-manifest.json
            lftp -u "$FTP_USER" --env-password \
              -e "$SETTINGS get '$WEB_ROOT/deploy-manifest.json' -o /tmp/elozo-manifest.json; bye" \
              "$FTP_HOST" 2>/dev/null || true

            python3 scripts/deploy-valtozas.py \
              --mappa out --elozo /tmp/elozo-manifest.json \
              --stage /tmp/feltoltendo --uj /tmp/deploy-manifest.json | tee /tmp/valtozas.txt
            VALTOZOTT=$(sed -n 's/^VALTOZOTT=//p' /tmp/valtozas.txt | tail -1)

            if [ "${VALTOZOTT:-0}" -gt 0 ]; then
              tukroz /tmp/feltoltendo/ ''
              # Fájlonkénti idő — ebből látszik, hozott-e valamit a beállítás.
              # A korábbi mérés két futáson egyaránt 0,42-0,43 s/fájl volt.
            else
              echo "Egyetlen fájl sem változott — nincs mit feltölteni."
            fi
          fi

          # A lenyomatlista CSAK a sikeres tükrözés után kerül ki. Ha a
          # feltöltés félbeszakad, a szerveren a régi lista marad, tehát a
          # következő deploy újra megpróbálja az elmaradt fájlokat — nem
          # állítja tévesen magáról, hogy naprakész.
          lftp -u "$FTP_USER" --env-password \
            -e "$SETTINGS put /tmp/deploy-manifest.json -o '$WEB_ROOT/deploy-manifest.json'; bye" \
            "$FTP_HOST"

          # ——— A küldési napló lekérése ————————————————————————————
          # A send.php a hibáit és a sikeres küldéseit is a webgyökérben lévő
          # send-errors.log fájlba írja. Kívülről nem olvasható — a .htaccess a
          # .log kiterjesztést nem szolgálja ki —, ezért itt, FTP-n át nézzük
          # meg. Személyes adat nincs benne: csak időpont, státusz és méretek.
          # Enélkül az „elküldve, de nem érkezett meg" eset nem elemezhető.
          echo "— küldési napló (send-errors.log) —"
          rm -f /tmp/send-errors.log
          lftp -u "$FTP_USER" --env-password \
            -e "$SETTINGS get '$WEB_ROOT/send-errors.log' -o /tmp/send-errors.log; bye" \
            "$FTP_HOST" 2>/dev/null || true
          if [ -s /tmp/send-errors.log ]; then
            tail -n 20 /tmp/send-errors.log
          else
            echo "(a napló üres, vagy még nem jött létre — azóta nem futott küldés)"
          fi

      # ——— A bluewaytrade.us saját webgyökere ————————————————————————
      # Csak akkor fut, ha a .us külön mappát kapott a tárhelyen. Ilyenkor a
      # blueway.hu .htaccess-e nem érvényes rá, tehát az átmeneti oldalt oda
      # is fel kell tölteni. Négy fájl, néhány másodperc.
      - name: Az SSH nem ment, FTP-vel ment ki
        if: steps.ssh.outcome == 'failure' && env.HAS_FTP == 'true'
        run: |
          echo "::warning::Az SSH-s feltöltés elhasalt, a weblap FTP-vel frissült. A fenti „Feltöltés SSH-val” lépés naplója megmondja, min múlt."

      - name: A bluewaytrade.us átmeneti oldala a saját gyökerébe
        if: steps.gate.outputs.go == 'true' && env.HAS_FTP == 'true' && env.HAS_US_ROOT == 'true'
        env:
          FTP_HOST: ${{ secrets.FORPSI_FTP_HOST }}
          FTP_USER: ${{ secrets.FORPSI_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FORPSI_FTP_PASSWORD }}
          US_ROOT: ${{ secrets.FORPSI_US_WEB_ROOT }}
        run: |
          set -euo pipefail
          # Az átmeneti lap megy ki, nem az out/us/ (az az amerikai angol
          # nyelvi változat, ami a blueway.hu gyökeréhez képest hivatkozik a
          # kellékeire — külön gyökérbe kiszakítva kép és szkript nélkül
          # maradna). Amíg a .us tényleges tartalma nem dől el, ide az
          # önmagában teljes átmeneti lap való.
          echo "Az átmeneti lap feltöltése ide: $US_ROOT"
          lftp -u "$FTP_USER" --env-password \
            -e "set ftp:passive-mode true; set ftp:sync-mode false; set net:max-retries 2; \
                set net:timeout 20; mirror -R --parallel=4 server/us-atmeneti/ '$US_ROOT/'; bye" \
            "$FTP_HOST"

      - name: Ellenőrzés — betölt-e az oldal
        if: steps.gate.outputs.go == 'true'
        env:
          LEVELPROBA: ${{ inputs.levelproba }}
        run: |
          # Az ellenőrzés HTTP-n megy, nem HTTPS-en: a tanúsítvány csak a
          # DNS-átállás után igényelhető, addig a https:// eleve nem jöhet
          # létre, és a hibája elfedné az igazi kérdést — kiszolgálja-e
          # egyáltalán a weblapot az új szerver.
          HOSZT=$(printf '%s' "$SITE_URL" | sed 's#^https\?://##; s#/.*##')
          echo "kiszolgáló IP-címe a futtató szerint: $(getent hosts "$HOSZT" | awk '{print $1}' | tr '\n' ' ')"

          # A /robots.txt szándékosan van a listán: sima fájl, nem igényel
          # átírást. Ha ez 200, de a /hu nem, akkor a .htaccess a hibás. Ha
          # egyik sem, akkor a kiszolgálás maga.
          # -L: az átirányításokat követjük. A tárhelyen be van kapcsolva a
          # WWW redirect, tehát a blueway.hu a www.blueway.hu-ra megy — a
          # végállomás státusza az érdekes, nem az első lépésé.
          # A szerviz oldal a listán az egyetlen HÁROM szintű útvonal. A
          # .htaccess kiterjesztés-nélküli átírása szintenként külön lépés,
          # tehát egy kétszintű oldal működése még nem bizonyítja, hogy a
          # mélyebb is működik.
          BAJ=0
          # Az /hu/iparagak/gyogyszeripar szintén három szintű, és a listán az
          # egyetlen lap, ami a legutóbb hozzáadott adatfájlból épül — ha ez
          # hiányzik, az a statikus kimenetre és nem a kiszolgálásra mutat.
          # Az /us/ azért van rajta, mert a .htaccess-ben évekig egy szabály
          # 404-elte ezt az útvonalat (akkor az átmeneti lap lakott ott). Ha
          # valaki visszateszi, az amerikai angol változat mind a 110 lapja
          # némán eltűnik, miközben a sitemap és a hreflang odamutat.
          # A /BingSiteAuth.xml a Bing Webmaster Tools tulajdonjog-igazolása:
          # a Bing időről időre újra lekéri, és ha eltűnne, a tulajdonjog is
          # elveszne vele — a sitemap-beküldés és a jelentések is.
          for ut in /robots.txt /BingSiteAuth.xml / /hu /hu/rolunk /hu/kapcsolat /hu/szolgaltatasok/szerviz \
                    /hu/iparagak /hu/iparagak/gyogyszeripar /us /us/kapcsolat; do
            V=$(curl -sSL -o /dev/null --max-time 25 \
                 -w '%{http_code} vegallomas=%{url_effective} meret=%{size_download}' \
                 "http://$HOSZT$ut" || echo "000 -")
            echo "GET http://$HOSZT$ut -> $V"
            case "$V" in 200\ *) ;; *) BAJ=$((BAJ + 1)) ;; esac
          done

          if [ "$BAJ" -gt 0 ]; then
            echo "::warning::$BAJ útvonal nem 200-zal zárult. Ha a fenti IP-cím még a régi kiszolgálóé, a DNS terjedésére kell várni."
          else
            echo "A weblap kiszolgálása rendben — minden próbált útvonal 200-zal zárult."
          fi

          # ——— A sitemap-beli címek átirányítás nélkül feleljenek —————
          # A sitemapban és a kanonikus hivatkozásokban a perjel NÉLKÜLI alak
          # áll (/hu, /hu/termekek). A mod_dir ezeket sokáig a perjeles alakra
          # irányította — a Search Console 2026 augusztusában név szerint ezt
          # jelezte („átirányítást tartalmazó oldal" a webhelytérképben). A
          # .htaccess DirectorySlash Off állítása szüntette meg; ez a próba
          # azt őrzi, hogy meg is maradjon úgy.
          #
          # A kérés végállomásának ÚTVONALÁT hasonlítjuk a kérthez: a
          # gazdagép- vagy sémaváltás (www, https) nem hiba, a hozzáfűzött
          # perjel az. Mind a három próbált cím mappaként is létezik, tehát
          # pontosan őket fenyegeti a perjeles átirányítás.
          PERJEL_BAJ=0
          for ut in /hu /hu/termekek /us; do
            VEG=$(curl -sSL -o /dev/null --max-time 25 -w '%{url_effective}' "http://$HOSZT$ut" || echo "-")
            VEG_UT=$(printf '%s' "$VEG" | sed 's#^https\?://[^/]*##')
            echo "GET $ut -> végállomás útvonala: ${VEG_UT:-(üres)}"
            if [ "$VEG_UT" != "$ut" ]; then PERJEL_BAJ=$((PERJEL_BAJ + 1)); fi
          done
          if [ "$PERJEL_BAJ" -gt 0 ]; then
            echo "::warning::$PERJEL_BAJ sitemap-beli cím átirányításra fut (perjeles alak?) — a keresők emiatt nem indexelik őket. Ellenőrizd a .htaccess DirectorySlash Off sorát."
          else
            echo "A sitemap-beli címek átirányítás nélkül felelnek."
          fi

          # ——— A perjeles alak: kiszolgálás igen, átirányítás nem ————————
          # A másik irány. A fenti próba azt őrzi, hogy a perjel NÉLKÜLI címhez
          # ne fűzzön perjelet a szerver; ez azt, hogy a perjeles alak
          # (…/it/termekek/) továbbra is kiszolgálja a tartalmat, és a benne
          # lévő kanonikus hivatkozás a perjel nélkülire mutasson.
          #
          # Miért külön lépés: a Google 2026 augusztusában feltérképezte az
          # /it/termekek/ címet — régi könyvjelzőből vagy külső hivatkozásból
          # ilyen alakok a jövőben is érkeznek. A visszairányítás itt TILOS:
          # amíg a mod_dir hozzáfűzte a perjelet, a levágó szabállyal együtt
          # végtelen kör lett belőle („Maximum (50) redirects followed"),
          # élesben. A helyes állapot tehát: 200, és a kanonikus a perjel
          # nélküli címre mutat — ezt a kettőt együtt kell őrizni.
          echo "— a perjeles alak —"
          PJ_BAJ=0
          for ut in /hu/termekek /it/termekek /us; do
            KOD=$(curl -sS -o /tmp/perjel.html --max-time 25 -w '%{http_code}|%{num_redirects}' \
                  "https://$HOSZT$ut/" 2>/dev/null || echo '000|0')
            KAN=$(grep -o '<link rel="canonical" href="[^"]*"' /tmp/perjel.html 2>/dev/null \
                  | head -1 | sed 's/.*href="//; s/"//')
            case "$KOD" in
              200\|0) ;;
              *) echo "::warning::A $ut/ nem 200-zal, átirányítás nélkül felelt ($KOD)."; PJ_BAJ=$((PJ_BAJ + 1)); continue ;;
            esac
            if [ "$KAN" = "https://$HOSZT$ut" ] || [ "$KAN" = "${SITE_URL%/}$ut" ]; then
              echo "  $ut/ -> 200, kanonikus: $KAN"
            else
              echo "::warning::A $ut/ kanonikus hivatkozása $KAN — a perjel nélküli címre kellene mutatnia."
              PJ_BAJ=$((PJ_BAJ + 1))
            fi
          done
          [ "$PJ_BAJ" -eq 0 ] && echo "  a perjeles alak kiszolgálja a tartalmat, és a kanonikus a perjel nélkülire mutat"

          # ——— A bluewaytrade.us átmeneti lapja ————————————————————
          # Ez a domain még nem biztos, hogy erre a tárhelyre mutat, ezért a
          # próba SOHA nem bukhat el — csak tájékoztat. Két dolgot néz:
          #   1. ugyanarra az IP-címre mutat-e, mint a blueway.hu (ha nem, a
          #      DNS-t kell átállítani, a feltöltött lapot senki nem látja),
          #   2. az „Under construction” szöveg érkezik-e vissza.
          echo "— bluewaytrade.us —"
          FO_IP=$(getent hosts "$HOSZT" | awk '{print $1}' | sort -u | tr '\n' ' ')
          US_IP=$(getent hosts bluewaytrade.us | awk '{print $1}' | sort -u | tr '\n' ' ')
          echo "  blueway.hu IP: ${FO_IP:-nincs} / bluewaytrade.us IP: ${US_IP:-nincs}"
          if [ -z "$US_IP" ]; then
            echo "::warning::A bluewaytrade.us nem oldható fel — a DNS-bejegyzés hiányzik vagy még nem terjedt el."
          else
            USV=$(curl -sSL -o /tmp/us.html --max-time 25 -w '%{http_code}' "http://bluewaytrade.us/" || echo 000)
            echo "  GET http://bluewaytrade.us/ -> $USV"
            if [ "$USV" = "200" ] && grep -qi 'under construction' /tmp/us.html; then
              echo "  az átmeneti lap kint van"
              # A logó külön kérés. A státuszkód ÖNMAGÁBAN nem elég: a lapot
              # kiszolgáló mindent-átíró szabály a képre is 200-zal felelne —
              # csak éppen a HTML-lel. Ezért a tartalomtípust nézzük.
              LOGOV=$(curl -sSL -o /dev/null --max-time 20 -w '%{http_code} %{content_type}' "http://bluewaytrade.us/blueway-logo-anim.webp" || echo "000 -")
              echo "  GET /blueway-logo-anim.webp -> $LOGOV"
              case "$LOGOV" in
                200\ image/*) echo "  a logó valóban képként érkezik" ;;
                200\ *)       echo "::error::A bluewaytrade.us logója 200-zal jön, de NEM kép ($LOGOV) — az átíró szabály a HTML-t adja vissza a kép helyett, a lap logó nélkül jelenik meg." ;;
                *)            echo "::warning::A bluewaytrade.us logója nem érhető el ($LOGOV) — a lap logó nélkül jelenik meg." ;;
              esac
              # A robots.txt ugyanabba a csapdába eshet, mint a logó: a
              # mindent-átíró szabály HTML-t adna vissza helyette. Egy robot
              # ezt érvénytelen robots-fájlnak látja.
              USROB=$(curl -sSL -o /dev/null --max-time 20 -w '%{http_code} %{content_type}' "http://bluewaytrade.us/robots.txt" || echo "000 -")
              echo "  GET /robots.txt -> $USROB"
              case "$USROB" in
                200\ text/plain*) echo "  a robots.txt szövegként érkezik" ;;
                *)                echo "::warning::A bluewaytrade.us robots.txt-je nem szöveges fájlként jön ($USROB)." ;;
              esac
            elif [ "$USV" = "200" ]; then
              echo "::warning::A bluewaytrade.us válaszol, de nem az átmeneti lapot adja — vagy külön dokumentumgyökere van (ekkor a FORPSI_US_WEB_ROOT titkot kell beállítani), vagy máshová mutat a DNS."
            else
              echo "::warning::A bluewaytrade.us nem 200-zal felelt ($USV)."
            fi
          fi

          # Érvényesül-e egyáltalán a .htaccess? A gyorsítótár-fejlécet a mi
          # fájlunk állítja be; ha megjelenik, a tárhely olvassa a .htaccess-t,
          # tehát egy hibás viselkedés a szabályaink hibája. Ha hiányzik, akkor
          # a tárhelyen nincs engedélyezve a felülbírálás, és az ügyfélszolgálat
          # tud segíteni.
          # ——— Működik-e a levélküldő végpont? ———————————————————
          # Két próba, egyik sem küld levelet és egyik sem fogyaszt a
          # sebességkorlátból.
          echo "— a levélküldő végpont —"

          # 1. GET: a send.php csak POST-ot fogad, tehát 405-öt kell adnia.
          #    Ha 200 jön, a kiszolgáló NEM futtatja a PHP-t, hanem a fájl
          #    tartalmát adja ki — ez a forráskód nyilvánosságra kerülését
          #    jelentené, ezért külön nézzük a válasz törzsét is.
          GETK=$(curl -sSL -o /tmp/sendphp.txt --max-time 20 -w '%{http_code}' "http://$HOSZT/send.php" || echo 000)
          echo "GET  /send.php -> $GETK"
          if grep -q '<?php' /tmp/sendphp.txt 2>/dev/null; then
            echo "::error::A kiszolgáló a send.php FORRÁSKÓDJÁT adja vissza — a PHP nincs bekapcsolva ehhez a weboldalhoz. Amíg ez így van, az űrlap nem tud küldeni."
          elif [ "$GETK" = "405" ]; then
            echo "  a PHP fut (a csak-POST szabály érvényesül)"
            # A 405 válasz tartalmazza az érvényes PHP-korlátokat. Ebből
            # látszik, hogy a .user.ini érvényesül-e: ha a post_max_size 12M
            # és a memory_limit 256M, akkor igen. Ha a PHP alapértékei (8M /
            # 2M) jönnek vissza, a csatolmányos küldés eleve elakad, mielőtt a
            # send.php bármit látna belőle.
            echo "  érvényes PHP-korlátok: $(sed -n 's/.*"php":{\(.*\)}}/\1/p' /tmp/sendphp.txt)"
            if grep -q '"post_max_size":"12M"' /tmp/sendphp.txt; then
              echo "  a .user.ini érvényesül"
            else
              echo "::warning::A .user.ini láthatóan NEM érvényesül — a PHP a saját alapértékeit használja. Csatolmánnyal a küldés emiatt akad el. A tárhelyen a PHP-kezelés módjától függ, hogy a .user.ini vagy a .htaccess php_value a járható út; ezt az ügyfélszolgálat tudja megmondani."
            fi
          else
            echo "::warning::Váratlan válasz GET-re ($GETK). Várt: 405."
          fi

          # 2. POST a rejtett csapdamezővel kitöltve: a send.php ilyenkor
          #    csendben 200-at ad, levelet nem küld. Ez az egyetlen ág, amivel
          #    a teljes POST-útvonal mellékhatás nélkül próbálható.
          #
          #    A kérés a VÉGLEGES gépnévre megy, nem a puszta domainre. A
          #    tárhely a www nélküli alakot 301-gyel átirányítja, és egy POST
          #    ilyenkor elakad — pontosan ezért lett a weblap végpontja
          #    relatív. A böngésző is arról a gépről küld, ahonnan az oldalt
          #    kapta, tehát ez a próba azt méri, amit a látogató tapasztal.
          #    A SÉMÁT is a végállomásból vesszük, nem csak a gépnevet. A
          #    tárhelyen be van kapcsolva a HTTPS-terelés, tehát egy http-s
          #    POST ugyanígy 301-et kapna és elveszne — a próba pedig hamisan
          #    azt jelentené, hogy a küldés nem működik.
          VEGSO=$(curl -sSL -o /dev/null --max-time 20 -w '%{url_effective}' "http://$HOSZT/" || echo "http://$HOSZT/")
          KULDO=$(printf '%s' "$VEGSO" | sed 's#/*$##')
          echo "a küldés célja: $KULDO"
          POSTV=$(curl -sS --max-time 25 -X POST -F '_gotcha=probe' "$KULDO/send.php" \
                  -o /tmp/sendpost.txt -w '%{http_code}' || echo 000)
          echo "POST /send.php -> $POSTV  válasz: $(head -c 60 /tmp/sendpost.txt 2>/dev/null)"
          if [ "$POSTV" = "200" ]; then
            echo "  a levélküldés útvonala él — az űrlap közvetlenül küld, nem levelezőt nyit"
          else
            echo "::warning::A send.php nem 200-zal felelt a POST-ra ($POSTV). Az űrlap ilyenkor a mailto-tartalékra vált."
          fi

          # 3. Próba a legnagyobb megengedett (7 MB-os) csatolmánnyal. A
          #    `_probe` mezőtől a send.php mindent elvégez (a feltöltés
          #    fogadását, a base64-kódolást, a levél összeállítását), csak a
          #    küldés marad el — tehát ez a próba nem küld levelet senkinek.
          #    A válaszból kiderül, hogy a határméretű csatolmány eljut-e a
          #    szkriptig, mekkora levél lesz belőle, és mennyi memóriát kíván.
          head -c 7000000 /dev/urandom > /tmp/probe.png
          PROBAV=$(curl -sS --max-time 120 -X POST "$KULDO/send.php" \
                   -F '_probe=1' -F 'email=probe@blueway.hu' \
                   -F 'attachment=@/tmp/probe.png;type=image/png' \
                   -o /tmp/sendprobe.txt -w '%{http_code}' || echo 000)
          echo "POST /send.php 7 MB csatolmánnyal -> $PROBAV"
          echo "  válasz: $(head -c 300 /tmp/sendprobe.txt 2>/dev/null)"
          if [ "$PROBAV" = "200" ]; then
            echo "  a határméretű csatolmány eljut a szkriptig, és a levél összeáll belőle"
          else
            echo "::warning::A 7 MB-os csatolmány próbája nem 200-zal zárult ($PROBAV) — a valódi küldés eddig a pontig sem jut el."
          fi

          # 4. VALÓDI próbalevelek — csak kézi indításra, a levelproba
          #    beállítással. A 2/5/8 MB-os méréssorozat megadta a határt: az
          #    5 MB-os megérkezett, a 8 MB-os nem — a levelezőrendszer valahol
          #    7 és 11 MB közötti levélméretnél vág, ezért lett a csatolási
          #    korlát 7 MB (base64-ben ~9,6 MB levél). Ez a próba az új határt
          #    igazolja: a 7 MB-os levélnek meg kell érkeznie, a 8 MB-osat
          #    pedig már a send.php-nak kell 413-mal elutasítania.
          if [ "$LEVELPROBA" = "vegrehajt" ]; then
            echo "— valódi próbalevelek csatolmánnyal —"
            for MB in 7 8; do
              head -c $((MB * 1000000)) /dev/urandom > "/tmp/proba-$MB.png"
              LV=$(curl -sS --max-time 180 -X POST "$KULDO/send.php" \
                   -F "_subject=Levélküldési próba — $MB MB csatolmány" \
                   -F 'email=info@blueway.hu' \
                   -F "uzenet=Automatikus próba a deployból: $MB MB-os csatolmány. Ha ez a levél megérkezett, ekkora csatolmánnyal működik a küldés." \
                   -F "attachment=@/tmp/proba-$MB.png;type=image/png" \
                   -o /tmp/probalevel.txt -w '%{http_code}' || echo 000)
              echo "próbalevél $MB MB -> $LV  válasz: $(head -c 120 /tmp/probalevel.txt 2>/dev/null)"
            done
            echo "A várt eredmény: a 7 MB-os 200-zal megy és megérkezik, a 8 MB-os 413-mal elutasítva."
          fi

          # ——— A régi weblap belépési pontja ————————————————————————
          # A régi weblap index.php-je könyvjelzőben, e-mail aláírásban és
          # nyomtatott anyagon fennmaradhatott. A .htaccess 301-gyel a
          # nyitóoldalra viszi; itt az látszik, hogy tényleg meg is teszi.
          # Nem a végállomást nézzük, hanem az ELSŐ választ: a végállomás a
          # nyelvválasztó miatt úgyis a nyitóoldal lenne, akkor is, ha a
          # szabály néma marad és a kérés 404-re fut.
          #
          # A kérés HTTPS-sel indul, nem HTTP-vel. A tárhely panelja a
          # HTTP-kéréseket előbb tereli HTTPS-re, mint hogy a .htaccess szóhoz
          # jutna — http://-ról indítva tehát az első válasz a protokollváltás
          # lenne (301 https://blueway.hu/index.php), és a mérés a saját
          # szabályunkat sosem látná. Ezen bukott el az első éles próbán.
          echo "— a régi belépési pont —"
          REGI=$(curl -sSI --max-time 20 -o /dev/null -w '%{http_code} %{redirect_url}' \
                 "https://$HOSZT/index.php" 2>/dev/null || echo "000 -")
          echo "  GET /index.php -> $REGI"
          case "$REGI" in
            301\ "https://$HOSZT/") echo "  a régi belépési pont a nyitóoldalra fut, HTTPS-en" ;;
            301\ "http://$HOSZT/") echo "::warning::Az /index.php a nyitóoldalra fut, de HTTP-re — egy fölösleges ugrás, és egy pillanatra titkosítatlan. A .htaccess szabályában ki kell mondani a https-t." ;;
            301\ *) echo "::warning::Az /index.php átirányít, de nem a nyitóoldalra ($REGI)." ;;
            *) echo "::warning::Az /index.php nem 301-gyel felel ($REGI) — a régi cím 404-re fut." ;;
          esac

          # ——— A régi weblap címei ——————————————————————————————————
          # Mintavétel a régi Yii-címekből: egy termék, egy kategória, egy
          # gyártói lap és egy állandó lap, magyarul és angolul. A VÉGÁLLOMÁST
          # nézzük: a 301-nek nemcsak el kell indulnia, hanem 200-zal is kell
          # végződnie — egy létező lapra mutató átirányítás ér valamit, a
          # 404-re mutató rosszabb, mint ha meg sem próbáltuk volna.
          echo "— a régi weblap címei —"
          for PAR in \
            "/termek/cab-squix-4-ipari-cimkenyomtato-1|/hu/termekek/cimkenyomtatok/cab-squix-4" \
            "/product/cab-eos2-label-printer-5|/en/termekek/cimkenyomtatok/cab-eos2" \
            "/termekek/kategoriak/cimkezo-gepek-7|/hu/termekek/cimkezo-gepek" \
            "/products/brands/cab-3|/en/gyartok/cab" \
            "/partnereink|/hu/gyartok" \
            "/termek/nincs-ilyen-999|/hu/termekek" \
            "/contact|/en/kapcsolat" \
            "/termekek|/hu/termekek" \
            "/termekek/gyartok/cab-3|/hu/gyartok/cab"; do
            BE="${PAR%%|*}"; VART="${PAR##*|}"
            EREDMENY=$(curl -sSL -o /dev/null --max-time 25 \
                       -w '%{http_code} %{url_effective}' "https://$HOSZT$BE" 2>/dev/null || echo "000 -")
            ALLAPOT="${EREDMENY%% *}"; VEG="${EREDMENY#* }"
            # A záró perjel nem számít különbségnek. A kiszolgáló azokhoz a
            # lapokhoz teszi ki, amelyek mappaként is léteznek (a Next.js
            # ugyanazon a néven mappát és .html-t is készít) — a
            # /hu/termekek/cimkezo-gepek tehát perjellel áll meg, a
            # /hu/termekek/cimkenyomtatok/cab-squix-4 pedig anélkül. Enélkül a
            # három ilyen cím hamis figyelmeztetést adott.
            VEG="${VEG%/}"
            if [ "$ALLAPOT" = "200" ] && [ "$VEG" = "https://$HOSZT$VART" ]; then
              echo "  $BE -> $VART"
            else
              echo "::warning::A régi cím $BE nem a várt helyen áll meg. Várt: https://$HOSZT$VART, kapott: $EREDMENY"
            fi
          done

          # ——— A régi PHP-alkalmazás nem szivároghat ————————————————
          # Az archiválás a webgyökéren KÍVÜLRE tette a régi weblapot, tehát
          # ezeknek nem szabad kiszolgálódniuk. Külön ellenőrzés, mert a
          # protected/config/main.php az adatbázis jelszavát tartalmazza, a
          # pma pedig egy phpMyAdmin volt — ha bármelyik újra elérhetővé
          # válna (rossz WEB_ROOT, visszamásolás, szolgáltatói visszaállítás),
          # arról tudni akarunk, méghozzá azonnal.
          echo "— a régi alkalmazás nem szolgálódik ki —"
          SZIVARGAS=0
          for UT in /protected/config/main.php /protected/config/db.php /pma/ /admin/ \
                    /uploads/ /_blueway_old.rar; do
            V=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "https://$HOSZT$UT" 2>/dev/null || echo 000)
            # 404 vagy 403 a jó válasz; a 301 is rendben van, ha a nyitóoldalra visz.
            case "$V" in
              200) echo "::warning::A $UT KISZOLGÁLÓDIK ($V) — a régi alkalmazás visszakerült a webgyökérbe."
                   SZIVARGAS=$((SZIVARGAS + 1)) ;;
              *)   echo "  $UT -> $V" ;;
            esac
          done
          [ "$SZIVARGAS" -eq 0 ] && echo "  a régi alkalmazás egyetlen próbált útvonalon sem érhető el"

          # ——— Az AI-olvasóknak szánt fájlok ————————————————————————
          # A /llms.txt a gépi olvasók (AI-keresők, asszisztensek) belépési
          # pontja. Két dolognak kell teljesülnie: szövegként jöjjön (ne a
          # .txt→.html átírás HTML-je), és NE legyen rajta a lapozás-
          # adatcsomagokra szánt noindex fejléc.
          echo "— AI-fájlok —"
          AIV=$(curl -sS -o /tmp/llms.txt --max-time 20 -w '%{http_code} %{content_type}' "https://$HOSZT/llms.txt" 2>/dev/null || echo "000 -")
          AIFEJ=$(curl -sSI --max-time 20 "https://$HOSZT/llms.txt" 2>/dev/null | grep -i '^x-robots-tag:' || true)
          if [ "${AIV%% *}" = "200" ] && head -1 /tmp/llms.txt | grep -q '^# Blueway'; then
            if [ -z "$AIFEJ" ]; then
              echo "  /llms.txt -> $AIV, noindex fejléc nélkül — rendben"
            else
              echo "::warning::A /llms.txt-n rajta maradt a noindex fejléc ($AIFEJ) — a .htaccess kivétele nem érvényesül."
            fi
          else
            echo "::warning::A /llms.txt nem jó ($AIV) — az AI-olvasók belépési pontja nem érhető el."
          fi
          JSONV=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "https://$HOSZT/ai/termekek.json" 2>/dev/null || echo 000)
          [ "$JSONV" = "200" ] && echo "  /ai/termekek.json -> 200" || echo "::warning::Az /ai/termekek.json nem érhető el ($JSONV)."

          # ——— A Bing tulajdonjog-igazoló fájlja: a TARTALMA is stimmeljen ——
          # A 200-as állapot és a méret nem elég. A Bing a fájlban lévő
          # azonosítót keresi; ha oda bármi más kerülne — csonka feltöltés,
          # hibaoldal, más fiók kulcsa —, a Bing „nem érem el a fájlt"
          # hibát ad, a naplónk pedig ugyanúgy zölden jelentene.
          # A várt azonosítót a most épített fájlból vesszük, nem kézzel
          # beírva: így a próba akkor is helyes marad, ha a kulcs cserélődik.
          echo "— a Bing igazolása —"
          BINGVART=$(grep -o '<user>[^<]*</user>' out/BingSiteAuth.xml 2>/dev/null | head -1)
          if [ -z "$BINGVART" ]; then
            echo "::warning::Az out/BingSiteAuth.xml hiányzik vagy üres — a Bing tulajdonjog-igazolása elveszhet."
          else
            BINGELO=$(curl -sSL --max-time 20 "https://$HOSZT/BingSiteAuth.xml" 2>/dev/null || true)
            if printf '%s' "$BINGELO" | grep -qF "$BINGVART"; then
              echo "  /BingSiteAuth.xml -> az azonosító szó szerint megvan az élesen kiszolgált fájlban"
            else
              echo "::warning::A /BingSiteAuth.xml tartalma nem a várt. Vártuk: $BINGVART — kaptunk: $(printf '%s' "$BINGELO" | tr -d '\n' | head -c 160)"
            fi
          fi
          # A meta a tulajdonjog MÁSODIK lába, és a Bing szerint az igazolás
          # után sem törölhető. A nyitólapot nézzük, mert a Bing is azt kéri —
          # az azonosítót itt is a buildből vesszük, nem kézzel beírva.
          METAVART=$(grep -o 'name="msvalidate.01" content="[^"]*"' out/index.html 2>/dev/null | head -1)
          if [ -z "$METAVART" ]; then
            echo "::warning::A nyitólap buildjéből hiányzik az msvalidate.01 meta — a Bing tulajdonjoga elveszhet."
          else
            if curl -sSL --max-time 20 "https://$HOSZT/" 2>/dev/null | grep -qF "$METAVART"; then
              echo "  / -> az msvalidate.01 meta kint van a nyitólapon"
            else
              echo "::warning::A nyitólapon élesben nincs ott az msvalidate.01 meta (vártuk: $METAVART)."
            fi
          fi

          # ——— Tömörítés: megy-e ki gzip-pel a szöveg és a JavaScript ————
          # Ezt a lépést egy olyan hiba indokolja, amit innen NEM lehetett
          # megnézni: a .htaccess DEFLATE-listája sokáig csak az
          # `application/javascript`-et sorolta fel, az Apache viszont a
          # 2.4.55 óta a .js-hez `text/javascript`-et rendel. Ha a szerver a
          # modern nevet használja, a laponkénti ~590 kB JavaScript
          # tömörítetlenül megy ki — a látogatónak lassú, nekünk forgalom, és
          # SEMMI nem jelzi. A lista azóta mindkét nevet tartalmazza; ez a
          # próba azt őrzi, hogy tényleg érvényesül is.
          #
          # A JS-fájl nevét a lap forrásából szedjük: a Next a csomagok nevébe
          # lenyomatot ír, tehát kézzel beírt név egy build után elavulna.
          echo "— tömörítés —"
          curl -sS -o /tmp/tomorit.html --max-time 20 "https://$HOSZT/hu" 2>/dev/null || true
          # A minta almappát és URL-kódolt szakaszt is enged (chunks/app/%5Blang%5D/…):
          # a csak lapos nevekre írt első változat egy Next-frissítés után némán
          # üresre futott volna, és a lépés zölden jelentett volna ellenőrizetlenül.
          JSUT=$(grep -o '/_next/static/chunks/[A-Za-z0-9._%/-]*\.js' /tmp/tomorit.html 2>/dev/null | head -1 || true)
          if [ -z "$JSUT" ]; then
            echo "::warning::Nem találtam JS-csomagot a kezdőlap forrásában — a tömörítés a JavaScriptre ellenőrizetlen maradt."
          fi
          TOM_BAJ=0
          for UT in /hu /sitemap.xml /llms.txt $JSUT; do
            KOD=$(curl -sS -o /dev/null --max-time 20 -H 'Accept-Encoding: gzip' \
                  -w '%{content_type}|%{size_download}' "https://$HOSZT$UT" 2>/dev/null || echo '?|0')
            ENC=$(curl -sSI --max-time 20 -H 'Accept-Encoding: gzip' "https://$HOSZT$UT" 2>/dev/null \
                  | tr -d '\r' | awk 'tolower($1)=="content-encoding:"{print tolower($2)}')
            if [ "$ENC" = "gzip" ] || [ "$ENC" = "br" ]; then
              echo "  $UT -> $ENC (${KOD})"
            else
              echo "::warning::A $UT tömörítés nélkül megy ki (Content-Encoding: ${ENC:-nincs}, típus/méret: $KOD)."
              TOM_BAJ=$((TOM_BAJ + 1))
            fi
          done
          [ "$TOM_BAJ" -eq 0 ] && echo "  minden próbált fájl tömörítve érkezik"

          # ——— A kezdőlapi videósáv klipjei ————————————————————————
          # Ezt a lépést egy néma hibamód indokolja: ha egy klip hiányzik vagy
          # csonkán ér ki, a csempe nem panaszkodik — megfagyott poszterként
          # áll ott, és ránézésre teljesen rendben van. Ezért nem elég a
          # 200-as állapot: a típusnak videónak kell lennie, a méretnek pedig
          # akkorának, ami egy fél percnyi felvételnél egyáltalán értelmes.
          # A neveket a lap forrásából szedjük, nem kézzel — így ha egy új
          # csempe jön, magától bekerül az ellenőrzésbe.
          echo "— a kezdőlap videósávja —"
          curl -sS -o /tmp/kezdolap.html --max-time 20 "https://$HOSZT/hu.html" 2>/dev/null || true
          KLIPEK=$(grep -o '/videos/bemutato/[a-z0-9-]*\.\(mp4\|webm\)' /tmp/kezdolap.html 2>/dev/null | sort -u || true)
          if [ -z "$KLIPEK" ]; then
            echo "  a kezdőlapon nincs videósáv — nincs mit ellenőrizni"
          else
            for UT in $KLIPEK; do
              VAL=$(curl -sSI --max-time 30 "https://$HOSZT$UT" 2>/dev/null || true)
              ALL=$(printf '%s' "$VAL" | head -1 | tr -d '\r' | awk '{print $2}')
              TIP=$(printf '%s' "$VAL" | grep -i '^content-type:' | tr -d '\r' | awk '{print $2}')
              MER=$(printf '%s' "$VAL" | grep -i '^content-length:' | tr -d '\r' | awk '{print $2}')
              if [ "$ALL" != "200" ]; then
                echo "::warning::$UT -> ${ALL:-nincs válasz} — a csempe megfagyott poszterként fog állni."
              elif ! printf '%s' "$TIP" | grep -qi '^video/'; then
                echo "::warning::$UT -> 200, de a típusa '$TIP' — a böngésző nem videóként fogja kezelni."
              elif [ "${MER:-0}" -lt 200000 ]; then
                echo "::warning::$UT -> 200, de csak ${MER} bájt — ez csonka feltöltésre vall."
              else
                echo "  $UT -> 200 $TIP $((MER / 1024)) kB"
              fi
            done
          fi

          echo "— a .htaccess érvényesülése —"
          FEJLEC=$(curl -sSIL --max-time 20 "http://$HOSZT/hu.html" 2>/dev/null |
                   grep -i '^cache-control:' | tail -1)
          if printf '%s' "$FEJLEC" | grep -qi 'must-revalidate'; then
            echo "a .htaccess érvényesül ($FEJLEC)"
          else
            echo "::warning::A .htaccess gyorsítótár-fejléce nem jelenik meg (kapott: '${FEJLEC:-semmi}'). Elképzelhető, hogy a tárhely nem olvassa a .htaccess-t."
          fi

          # A lapozás adatcsomagjai noindex fejlécet kapnak, a robots.txt
          # viszont NEM — a kettő együtt bizonyítja, hogy a szabálypár jó
          # irányban fog: egy elrontott minta itt pont fordítva sülne el, és
          # vagy az egész oldalt tiltaná le, vagy semmit.
          # ——— Biztonsági fejlécek élesben ————————————————————————
          # A .htaccess-t itt nem tudjuk „lefuttatni", csak megnézni, mit ad
          # ténylegesen a kiszolgáló. Ha a tárhelyen nincs mod_headers, a
          # fejlécek némán elmaradnának — ez a lépés kimondja.
          echo "— biztonsági fejlécek —"
          FEJEK=$(curl -sSI --max-time 20 "https://$HOSZT/hu" 2>/dev/null || true)
          for F in content-security-policy x-content-type-options referrer-policy x-frame-options permissions-policy; do
            if printf '%s' "$FEJEK" | grep -qi "^$F:"; then
              echo "  ✓ $F"
            else
              echo "::warning::Hiányzik a(z) $F fejléc. Ha mind az öt hiányzik, a tárhelyen valószínűleg nincs bekapcsolva a mod_headers."
            fi
          done

          ROBOTS_FEJ=$(curl -sSI --max-time 20 "https://$HOSZT/robots.txt" 2>/dev/null | grep -i '^x-robots-tag:' || true)
          ADAT_FEJ=$(curl -sSI --max-time 20 "https://$HOSZT/hu.txt" 2>/dev/null | grep -i '^x-robots-tag:' || true)
          if [ -z "$ROBOTS_FEJ" ] && printf '%s' "$ADAT_FEJ" | grep -qi noindex; then
            echo "az X-Robots-Tag helyesen áll: a robots.txt-n nincs, az adatcsomagon noindex"
          else
            echo "::warning::Az X-Robots-Tag nem a várt módon áll. robots.txt: '${ROBOTS_FEJ:-nincs}', hu.txt: '${ADAT_FEJ:-nincs}'. Várt: robots.txt-n semmi, hu.txt-n noindex."
          fi

          # ——— Az átirányítások iránya ————————————————————————————
          # A kanonikus cím a www NÉLKÜLI, HTTPS-es alak. Két beállítás terel
          # ide: a www-t a .htaccess szabálya (a tárhely saját, fordított
          # irányú kapcsolója letiltva), a HTTPS-re pedig a panel "SSL
          # redirect" kapcsolója. Mind a négy belépési pontot végigmérjük —
          # ebből az is kiderül, ha a kettő egymásnak dobálná a látogatót.
          # A -w '%{num_redirects}' azért kell, mert egy kör itt nem hibaként,
          # hanem sok ugrásként látszik.
          echo "— az átirányítások iránya —"
          KANONIKUS="https://$HOSZT/"
          for BE in "http://$HOSZT/" "http://www.$HOSZT/" "https://www.$HOSZT/"; do
            EREDMENY=$(curl -sSL -o /dev/null --max-time 25 \
                       -w '%{url_effective} ugras=%{num_redirects} allapot=%{http_code}' \
                       "$BE" || echo "? ugras=? allapot=000")
            echo "  $BE -> $EREDMENY"
            case "$EREDMENY" in
              "$KANONIKUS"*) ;;
              *) echo "::warning::A $BE nem a kanonikus $KANONIKUS címen áll meg." ;;
            esac
            UGRAS=$(printf '%s' "$EREDMENY" | sed -n 's/.*ugras=\([0-9]*\).*/\1/p')
            if [ -n "$UGRAS" ] && [ "$UGRAS" -gt 3 ]; then
              echo "::warning::A $BE $UGRAS átirányításon megy át. Kettőnél több már körre utal — a panel SSL/WWW kapcsolója és a .htaccess szabálya dobálja egymásnak a kérést."
            fi
          done

          # ——— HTTPS és tanúsítvány ————————————————————————————————
          # A panel a saját ingyenes DV tanúsítványáról azt mondja, a
          # szolgáltatás nem jogosult rá — itt az látszik, mit ad a kiszolgáló
          # VALÓJÁBAN a 443-as porton: kinek szól, ki állította ki, meddig
          # érvényes, és érvényes-e a böngészők szemével. Nem állítja meg a
          # deployt: mérés, nem követelmény.
          echo "— HTTPS és tanúsítvány —"
          for GEP in "$HOSZT" "www.$HOSZT"; do
            echo "$GEP:"
            if TANU=$(echo | timeout 20 openssl s_client -connect "$GEP:443" -servername "$GEP" 2>/dev/null |
                      openssl x509 -noout -subject -issuer -enddate -ext subjectAltName 2>/dev/null); then
              printf '%s\n' "$TANU" | sed 's/^/  /'
            else
              echo "  nem adott tanúsítványt (a 443-as port nem válaszol, vagy nincs kiállítva)"
            fi
            HV=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "https://$GEP/" 2>/tmp/https-hiba.txt || true)
            if [ "$HV" = "200" ] || [ "$HV" = "301" ]; then
              echo "  https://$GEP/ -> $HV (a tanúsítványt a curl elfogadta)"
            else
              echo "  https://$GEP/ -> ${HV:-hiba}: $(head -c 200 /tmp/https-hiba.txt 2>/dev/null)"
            fi
          done

          # ——— Megújul-e a tanúsítvány, és megmarad-e minden név? ————
          #
          # A tárhely a tanúsítványt automatikusan hosszabbítja, egyetlen
          # feltétellel: a domain A rekordja folyamatosan a tárhelyre
          # mutasson. Ez a lépés nem hisz a feltételnek, hanem az EREDMÉNYT
          # méri — mennyi van hátra a lejáratig.
          #
          # A Let's Encrypt 90 napra állít ki, és jóval a lejárat előtt újít.
          # Ha 21 napon belülre csúszik a lejárat, a megújítás elakadt: ilyenkor
          # még két-három hét van cselekedni, mielőtt a látogatók böngésző-
          # riasztást kapnának.
          #
          # A nevek listája ugyanilyen fontos. A tanúsítvány a fődomain MELLETT
          # az aliaszt (bluewaytrade.us) is fedi — de az aliasz DNS-e máshol
          # van kezelve, mint a fődomainé, tehát külön elromolhat. Ha egy
          # megújításból csak az aliasz esik ki, a blueway.hu tökéletesen
          # működik tovább, és a hiba észrevétlen marad, amíg valaki meg nem
          # nyitja a .us címet.
          echo "— a tanúsítvány élettartama és névlistája —"
          if TANU=$(echo | timeout 20 openssl s_client -connect "$HOSZT:443" -servername "$HOSZT" 2>/dev/null |
                    openssl x509 -noout -enddate -ext subjectAltName 2>/dev/null); then
            LEJAR=$(printf '%s' "$TANU" | sed -n 's/^notAfter=//p')
            MOST=$(date +%s)
            VEGE=$(date -d "$LEJAR" +%s 2>/dev/null || echo 0)
            if [ "$VEGE" -gt 0 ]; then
              NAP=$(( (VEGE - MOST) / 86400 ))
              if [ "$NAP" -lt 0 ]; then
                echo "::error::A tanúsítvány LEJÁRT ($LEJAR). Minden látogató böngésző-riasztást kap."
              elif [ "$NAP" -lt 21 ]; then
                echo "::warning::A tanúsítvány $NAP nap múlva lejár ($LEJAR), és még nem újult meg. A Let's Encrypt jóval korábban szokott — nézd meg a tárhely SSL-oldalát és a domain A rekordját."
              else
                echo "  $NAP nap van hátra ($LEJAR) — a megújítás rendben halad"
              fi
            fi
            for NEV in "$HOSZT" "www.$HOSZT" bluewaytrade.us www.bluewaytrade.us; do
              if printf '%s' "$TANU" | grep -q "DNS:$NEV\b"; then
                echo "  ✓ $NEV"
              else
                echo "::warning::A tanúsítványból hiányzik: $NEV — erre a névre a látogató böngésző-riasztást kap."
              fi
            done
          else
            echo "::warning::A tanúsítvány nem olvasható ki — a lejárat és a névlista nem ellenőrizhető."
          fi

      # ——— Az SSH hibája, a napló legvégén ————————————————————————
      # Az SSH-lépés diagnosztikája a build ezer sora és az ellenőrző lépés
      # közé szorul, a napló végét pedig ez utóbbi tölti ki — a hiba oka
      # gyakorlatilag olvashatatlan marad. Ezért a job UTOLSÓ lépéseként
      # megismételjük a lényeget. A titkokból semmit nem ír ki: csak az
      # OpenSSH és az rsync saját hibaüzeneteit, amiket a lépés fájlba is
      # elmentett.
      - name: IndexNow — a Bing (és a ChatGPT-keresés) értesítése
        if: steps.gate.outputs.go == 'true'
        # Miért van ez itt: a ChatGPT keresője a Bing indexéből dolgozik, a
        # weblap viszont eddig CSAK a Google-nek volt bejelentve — a Bing felé
        # soha semmi nem jelezte, hogy létezünk vagy hogy változtunk. Az
        # IndexNow erre való: egy POST a friss címlistával, és a Bing (meg a
        # Naver és a Yandex — a koreai lapoknak a Naver számít) azonnal tudja,
        # mit kell újraolvasnia. A kulcsfájl a public mappából megy ki
        # (https://blueway.hu/<kulcs>.txt), a protokoll ebből hitelesít.
        #
        # A teljes címlistát küldjük (a korlát 10 000, mi ~900-nál járunk):
        # a telepítés ritka esemény, és a változott lapok listáját külön
        # előállítani több hibalehetőség, mint amennyit a szűkítés ér.
        # A lépés nem buktatja a telepítést: az értesítés elmaradása nem
        # teszi hibássá a kint lévő weblapot.
        run: |
          KULCS=cfa63a7a5424886667a90eea8c9ef2e4
          HOSZT=$(printf '%s' "$SITE_URL" | sed 's#^https\?://##; s#/.*##')
          # Csak a MEGVÁLTOZOTT lapokat jelentjük be. A Bing Webmaster Tools
          # 2026 szeptemberében ezt kifogásolta („Avoid IndexNow Batch Mode"):
          # ha minden telepítéskor mind a 907 címet beküldjük, a jelzés nem
          # mond semmit, és a feltérképezés is késhet. A teljes lista amúgy is
          # ki van adva a sitemapben — az IndexNow arra való, hogy mi ÚJ.
          # A szkript maga dönt, honnan tudja a változást (rsync-lista az
          # SSH-ágon, stage mappa az FTP-ágon), és ha egyiket sem találja,
          # a teljes listára esik vissza — inkább egy fölösleges teljes
          # bejelentés, mint egy elmaradt új lap.
          python3 scripts/indexnow-cimek.py \
            --sitemap out/sitemap.xml --hoszt "$HOSZT" --kulcs "$KULCS" \
            --kimenet /tmp/indexnow.json \
            --lista /tmp/valtozott-lapok.txt --stage /tmp/feltoltendo \
            > /tmp/indexnow-mod.txt
          MOD=$(sed -n 's/^MOD=//p' /tmp/indexnow-mod.txt)
          DB=$(sed -n 's/^DB=//p' /tmp/indexnow-mod.txt)
          OSSZES=$(sed -n 's/^OSSZES=//p' /tmp/indexnow-mod.txt)
          if [ "${DB:-0}" -eq 0 ]; then
            echo "IndexNow: egyetlen lap sem változott — nincs mit bejelenteni ($OSSZES cím van a sitemapben)."
            exit 0
          fi
          V=$(curl -sS -o /tmp/indexnow-valasz.txt -w '%{http_code}' \
              -X POST 'https://api.indexnow.org/indexnow' \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @/tmp/indexnow.json --max-time 30 || echo 000)
          case "$V" in
            200|202) echo "IndexNow: $DB cím bejelentve ($V, mód: $MOD, a sitemapben $OSSZES) — a Bing/Naver/Yandex értesítve." ;;
            *) echo "::warning::Az IndexNow-értesítés nem sikerült ($V): $(head -c 300 /tmp/indexnow-valasz.txt 2>/dev/null)" ;;
          esac

      - name: Miért nem ment az SSH
        if: steps.gate.outputs.go == 'true' && steps.ssh.outcome == 'failure'
        run: |
          echo "Az SSH-s feltöltés elhasalt, a weblap FTP-vel frissült."
          if [ -s /tmp/ssh-allapot.txt ]; then
            echo "— meddig jutott el —"
            sed 's/^/  /' /tmp/ssh-allapot.txt
          fi
          VOLT=0
          for PAR in "a kulcs beolvasása|/tmp/kulcs-hiba.txt" \
                     "a kiszolgáló gazdakulcsa|/tmp/keyscan.txt" \
                     "a bejelentkezés|/tmp/ssh-hiba.txt" \
                     "az rsync|/tmp/rsync-hiba.txt"; do
            CIMKE="${PAR%%|*}"; F="${PAR##*|}"
            if [ -s "$F" ]; then
              echo "— $CIMKE —"
              sed 's/^/  /' "$F"
              VOLT=1
            fi
          done
          [ "$VOLT" = "1" ] || echo "Egyetlen diagnosztikai fájl sem keletkezett — a lépés a legelső ellenőrzésen bukott el, lásd a „Feltöltés SSH-val” lépés naplóját."
