; A weblap 7 MB-ig enged csatolmányt; a PHP alapértéke gyakran ennél kisebb
; (upload_max_filesize 2M), ilyenkor a küldés üres $_POST-tal érkezne meg.
; Ezt a fájlt a send.php mellé, a weboldal gyökerébe kell másolni.
; FORPSI Linux klaszteren a .user.ini támogatott.
upload_max_filesize = 12M
post_max_size = 12M
max_file_uploads = 20

; A csatolmány base64-kódolása memóriát eszik: a fájl mérete + a kódolt
; változat + a levéltörzs egyszerre van bent. Egy 7 MB-os csatolmánynál ez
; bőven 30 MB fölött jár. Az osztott tárhelyek szokásos 32-64 MB-os korlátja
; ilyenkor néma 500-as hibát okoz, amiből a látogató csak annyit lát, hogy a
; levelezője nyílik meg a küldés helyett.
memory_limit = 256M

; A nagy csatolmány feltöltése és kódolása tovább tart, mint egy sima kérés.
max_execution_time = 120
